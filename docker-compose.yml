services:
  video-analysis-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: video-analysis-server
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./data:/app/data:rw
    restart: unless-stopped
    networks:
      - video-analysis-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=3).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  video-analysis-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: video-analysis-client
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    volumes:
      - ./client/config:/app/config:ro
      - ./data:/app/data:rw
    depends_on:
      video-analysis-server:
        condition: service_started
    restart: unless-stopped
    networks:
      - video-analysis-network

networks:
  video-analysis-network:
    driver: bridge
